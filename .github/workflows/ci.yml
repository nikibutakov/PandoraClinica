name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Линтинг (ruff, mypy, pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend

      - name: Mypy
        run: mypy backend/app

      - name: Pylint (приложение)
        run: pylint backend/app

      # тесты: скидка на паттерны pytest (фикстуры и распаковка setup_world)
      - name: Pylint (тесты)
        run: pylint backend/tests --disable=redefined-outer-name,unused-variable
