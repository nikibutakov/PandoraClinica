# Прод: один nginx на оба приложения.
# 80 — staff (внутренний фронт), 81 — public (внешний сайт + табло /board).
# /api проксируется на бэкенд — CORS не участвует.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/staff;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 81;
    server_name _;

    root /usr/share/nginx/public;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
